app.datasource.fallback-jdbc-url=jdbc:postgresql://localhost:5432/online_learning
spring.datasource.url=${DATABASE_JDBC_URL:${DB_URL:${app.datasource.fallback-jdbc-url}}}
spring.datasource.username=${PGUSER:${DB_USERNAME:postgres}}
spring.datasource.password=${PGPASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true


logging.level.root=WARN
logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger=OFF
logging.level.org.hibernate=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.example.online_learning=INFO

app.course-analytics.async-delay-ms=1