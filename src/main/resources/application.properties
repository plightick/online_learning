# ===========================================
# 🗄️ DATABASE (Railway PostgreSQL)
# ===========================================
# Railway provides DATABASE_URL as postgresql://... which JDBC cannot use.
# Set DATABASE_JDBC_URL on the backend (JDBC form), built from linked Postgres refs, e.g.
# jdbc:postgresql://${{ Postgres.PGHOST }}:${{ Postgres.PGPORT }}/${{ Postgres.PGDATABASE }}.
# Replace Postgres with your DB service name. Do not bind spring.datasource.url to DATABASE_URL.
app.datasource.fallback-jdbc-url=jdbc:postgresql://localhost:5432/online_learning
spring.datasource.url=${DATABASE_JDBC_URL:${DB_URL:${app.datasource.fallback-jdbc-url}}}
spring.datasource.username=${PGUSER:${DB_USERNAME:postgres}}
spring.datasource.password=${PGPASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# 🗃️ JPA / HIBERNATE
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===========================================
# 📦 DATABASE INIT
# ===========================================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ===========================================
# 📝 LOGGING
# ===========================================
logging.level.root=WARN
logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger=OFF
logging.level.org.hibernate=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.example.online_learning=INFO

# ===========================================
# ⚙️ CUSTOM APP SETTINGS
# ===========================================
app.course-analytics.async-delay-ms=1

# ===========================================
# 🌐 SERVER
# ===========================================
server.port=${PORT:8080}