# ===========================================
# 🗄️ DATABASE (Railway PostgreSQL)
# ===========================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================================
# 🗃️ JPA / HIBERNATE
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===========================================
# 📦 DATABASE INIT
# ===========================================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ===========================================
# 📝 LOGGING
# ===========================================
logging.level.root=WARN
logging.level.org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger=OFF
logging.level.org.hibernate=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.example.online_learning=INFO

# ===========================================
# ⚙️ CUSTOM APP SETTINGS
# ===========================================
app.course-analytics.async-delay-ms=1

# ===========================================
# 🌐 SERVER
# ===========================================
server.port=${PORT:8080}