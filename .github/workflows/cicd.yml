name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: online_learning
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d online_learning"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/online_learning
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build (without tests)
        run: ./mvnw -B -DskipTests package

      - name: Run tests
        run: ./mvnw -B verify

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t online-learning-backend:ci .

      - name: Build frontend image
        run: docker build -t online-learning-frontend:ci ./frontend

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, docker]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Railway CLI
        env:
          RAILWAY_CLI_VERSION: 4.58.0
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/railway-cli"
          mkdir -p "${tmp}"
          curl -fsSL \
            "https://github.com/railwayapp/cli/releases/download/v${RAILWAY_CLI_VERSION}/railway-v${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -o "${tmp}/railway.tgz"
          tar -xzf "${tmp}/railway.tgz" -C "${tmp}"
          # Archive layout can vary; search without a tight maxdepth.
          bin="$(find "${tmp}" -type f -name railway -print -quit)"
          if [ -z "${bin}" ]; then
            echo "railway binary not found in release archive"
            tar -tzf "${tmp}/railway.tgz" | head -50
            exit 1
          fi
          sudo install -m 0755 "${bin}" /usr/local/bin/railway
          railway --version

      - name: Validate Railway configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then echo "Missing secret: RAILWAY_TOKEN"; exit 1; fi
          if [ -z "${RAILWAY_PROJECT_ID}" ]; then echo "Missing secret: RAILWAY_PROJECT_ID"; exit 1; fi
          if [ -z "${RAILWAY_ENVIRONMENT_ID}" ]; then echo "Missing secret: RAILWAY_ENVIRONMENT_ID"; exit 1; fi
          echo "Railway secrets present:"
          echo " - RAILWAY_TOKEN length=${#RAILWAY_TOKEN}"
          echo " - RAILWAY_PROJECT_ID length=${#RAILWAY_PROJECT_ID}"
          echo " - RAILWAY_ENVIRONMENT_ID length=${#RAILWAY_ENVIRONMENT_ID}"

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          echo "Starting: railway up backend"
          railway up .
            --ci
            --project "${{ secrets.RAILWAY_PROJECT_ID }}"
            --environment "${{ secrets.RAILWAY_ENVIRONMENT_ID }}"
            --service backend
            --path-as-root

      - name: Deploy frontend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          echo "Starting: railway up frontend"
          railway up frontend
            --ci
            --project "${{ secrets.RAILWAY_PROJECT_ID }}"
            --environment "${{ secrets.RAILWAY_ENVIRONMENT_ID }}"
            --service frontend
            --path-as-root

  healthcheck:
    name: Post-deploy Healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions: {}
    steps:
      - name: Check deployed app health
        env:
          APP_HEALTHCHECK_URL: ${{ vars.APP_HEALTHCHECK_URL }}
        run: |
          if [ -z "${APP_HEALTHCHECK_URL}" ]; then
            echo "Missing repo variable: APP_HEALTHCHECK_URL"
            exit 1
          fi

          echo "Waiting for healthy response from: ${APP_HEALTHCHECK_URL}"
          for i in {1..30}; do
            if curl -fsS "${APP_HEALTHCHECK_URL}" > /tmp/health.json; then
              echo "Healthcheck OK"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt ${i}/30 failed, retrying in 5s..."
            sleep 5
          done

          echo "Healthcheck failed after all retries. Last response:"
          cat /tmp/health.json || true
          exit 1
