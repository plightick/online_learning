name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: online_learning
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d online_learning"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/online_learning
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build (without tests)
        run: ./mvnw -B -DskipTests package

      - name: Run tests
        run: ./mvnw -B verify

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t online-learning-backend:ci .

      - name: Build frontend image
        run: docker build -t online-learning-frontend:ci ./frontend

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, docker]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway configuration
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then echo "Missing secret: RAILWAY_TOKEN"; exit 1; fi
          if [ -z "${RAILWAY_PROJECT_ID}" ]; then echo "Missing secret: RAILWAY_PROJECT_ID"; exit 1; fi
          if [ -z "${RAILWAY_ENVIRONMENT_ID}" ]; then echo "Missing secret: RAILWAY_ENVIRONMENT_ID"; exit 1; fi

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >
          railway up
          --project ${{ secrets.RAILWAY_PROJECT_ID }}
          --environment ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          --service backend
          --path-as-root .
          --detach

      - name: Deploy frontend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: >
          railway up
          --project ${{ secrets.RAILWAY_PROJECT_ID }}
          --environment ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          --service frontend
          --path-as-root frontend
          --detach

  healthcheck:
    name: Post-deploy Healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check deployed app health
        env:
          APP_HEALTHCHECK_URL: ${{ vars.APP_HEALTHCHECK_URL }}
        run: |
          if [ -z "${APP_HEALTHCHECK_URL}" ]; then
            echo "Missing repo variable: APP_HEALTHCHECK_URL"
            exit 1
          fi

          echo "Waiting for healthy response from: ${APP_HEALTHCHECK_URL}"
          for i in {1..30}; do
            if curl -fsS "${APP_HEALTHCHECK_URL}" > /tmp/health.json; then
              echo "Healthcheck OK"
              cat /tmp/health.json
              exit 0
            fi
            echo "Attempt ${i}/30 failed, retrying in 5s..."
            sleep 5
          done

          echo "Healthcheck failed after all retries. Last response:"
          cat /tmp/health.json || true
          exit 1

